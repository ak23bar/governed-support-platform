[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "governed-support-platform"
version = "0.1.0"
description = "Provider-neutral governed support contracts and E01 fakes"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.16,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5.0,<6",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gps"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gps"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
