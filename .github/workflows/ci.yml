name: E01 quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make bootstrap

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Formatting
        run: ruff format --check .
      - name: Linting
        run: ruff check .
      - name: Static typing
        run: mypy src
      - name: Unit tests
        run: pytest -q tests/unit
      - name: Provider contract tests
        run: pytest -q tests/contract
      - name: Integration shell tests
        run: pytest -q tests/integration
      - name: Security tests
        run: pytest -q tests/security
      - name: E02/E03 acceptance shells
        run: pytest -q tests/acceptance
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: License policy
        run: pip-licenses --fail-on='GPL;AGPL' --partial-match

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
